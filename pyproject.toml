[project]
name = "radcheck-bench-es"
version = "1.0.0"
description = "Benchmark for detecting internal inconsistencies in Spanish radiology reports"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Cristian Gutierrez" }]
keywords = ["radiology", "nlp", "benchmark", "spanish", "evaluation"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Natural Language :: Spanish",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Scoring needs nothing beyond the standard library. The optional extras cover the
# generation pipeline and the OpenAI-compatible runner so they are reproducible here too.
dependencies = []

[project.optional-dependencies]
gen = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/crstian19/radcheck-bench-es"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
